# Railway Deployment Configuration
[build]
  builder = "nixpacks"

[deploy]
  startCommand = "npm run railway-start"
  restartPolicyType = "on-failure"
  restartPolicyMaxRetries = 3

[env]
  NODE_ENV = "production"
  
[healthcheck]
  path = "/health"
  port = 3000
  
[networking]
  serviceDomain = "nacer-dev.me"