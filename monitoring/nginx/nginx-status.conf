server {
    listen 80;
    server_name localhost;

    # Nginx status endpoint for monitoring
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.0.0.0/8;  # Docker network
        deny all;
    }

    # Default location
    location / {
        return 200 "Nginx monitoring active\n";
        add_header Content-Type text/plain;
    }
}