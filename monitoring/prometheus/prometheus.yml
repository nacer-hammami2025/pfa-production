# Prometheus Configuration for PFA Application
# Enterprise-grade monitoring configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    service: pfa-platform

# Rule files - Alert rules for SLO monitoring
rule_files:
  - "rules/*.yml"
  - "alert-rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configurations
scrape_configs:
  # PFA Backend Application (running on host - LOCAL)
  - job_name: 'pfa-backend'
    static_configs:
      - targets: ['host.docker.internal:5001']
    metrics_path: '/api/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # PFA Backend Application (PRODUCTION on Render)
  - job_name: 'pfa-production'
    static_configs:
      - targets: ['pfa-production.onrender.com']
    metrics_path: '/api/metrics'
    scrape_interval: 30s
    scrape_timeout: 20s
    scheme: https

  # # Node.js Process Metrics (disabled - Linux only)
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

  # # MongoDB Metrics (disabled - not configured yet)
  # - job_name: 'mongodb-exporter'
  #   static_configs:
  #     - targets: ['mongodb-exporter:9216']

  # # Nginx Metrics (disabled - not configured yet)
  # - job_name: 'nginx-exporter'
  #   static_configs:
  #     - targets: ['nginx-exporter:9113']

  # # Docker Container Metrics (disabled - Linux only)
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']

  # Prometheus Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

