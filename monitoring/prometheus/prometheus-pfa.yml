global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'pfa-production'
    scrape_interval: 10s
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['nacer-dev.me:443']
    scheme: https
    
  - job_name: 'prometheus-self'
    static_configs:
      - targets: ['localhost:9090']

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093