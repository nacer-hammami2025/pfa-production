version: '3.8'

services:
  # Prometheus Server
  prometheus:
    image: prom/prometheus:latest
    container_name: pfa-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: unless-stopped
    networks:
      - monitoring

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: pfa-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring

  # Node Exporter for system metrics (Linux only)
  # node-exporter:
  #   image: prom/node-exporter:latest
  #   container_name: pfa-node-exporter
  #   ports:
  #     - "9100:9100"
  #   volumes:
  #     - /proc:/host/proc:ro
  #     - /sys:/host/sys:ro
  #     - /:/rootfs:ro
  #   command:
  #     - '--path.procfs=/host/proc'
  #     - '--path.rootfs=/rootfs'
  #     - '--path.sysfs=/host/sys'
  #     - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
  #   restart: unless-stopped
  #   networks:
  #     - monitoring

  # MongoDB Exporter (optionnel - décommenter si nécessaire)
  # mongodb-exporter:
  #   image: bitnami/mongodb-exporter:latest
  #   container_name: pfa-mongodb-exporter
  #   ports:
  #     - "9216:9216"
  #   environment:
  #     - MONGODB_URI=${MONGODB_URI:-mongodb://localhost:27017}
  #   restart: unless-stopped
  #   networks:
  #     - monitoring

  # cAdvisor for container metrics (Linux only)
  # cadvisor:
  #   image: gcr.io/cadvisor/cadvisor:latest
  #   container_name: pfa-cadvisor
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - /:/rootfs:ro
  #     - /var/run:/var/run:ro
  #     - /sys:/sys:ro
  #     - /var/lib/docker/:/var/lib/docker:ro
  #     - /dev/disk/:/dev/disk:ro
  #   privileged: true
  #   devices:
  #     - /dev/kmsg
  #   restart: unless-stopped
  #   networks:
  #     - monitoring

  # Alertmanager for alerts
  alertmanager:
    image: prom/alertmanager:latest
    container_name: pfa-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    restart: unless-stopped
    networks:
      - monitoring

  # Nginx Exporter (optionnel - décommenter si nginx est utilisé)
  # nginx-exporter:
  #   image: nginx/nginx-prometheus-exporter:latest
  #   container_name: pfa-nginx-exporter
  #   ports:
  #     - "9113:9113"
  #   command:
  #     - '-nginx.scrape-uri=http://nginx:80/nginx_status'
  #   restart: unless-stopped
  #   networks:
