  #   depends_on:
  #     - nginx

  # # Nginx with status module
  # nginx:
  #   image: nginx:alpine
  #   container_name: pfa-nginx
  #   ports:
  #     - "8081:80"
  #   volumes:
  #     - ./nginx/nginx-status.conf:/etc/nginx/conf.d/default.conf
  #   restart: unless-stopped
  #   networks:
