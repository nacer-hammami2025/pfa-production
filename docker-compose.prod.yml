version: '3.8'
services:
  backend:
    build: ./backend
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped

# Notes:
# - Ensure environment variables MONGO_URI and JWT_SECRET are provided to the docker-compose command or in an env file.
# - The nginx config in the frontend image proxies /api to the backend service on the same Docker network.